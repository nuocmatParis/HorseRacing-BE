spring.application.name=SWP391_Project_HRTMS

spring.main.banner-mode=off

logging.level.root=info

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JWT Configuration
jwt.signer-key=${JWT_SIGNER_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL}

openai.api.key=${OPENAI_API_KEY}
#openai.base-url=https://api.yescale.io/v1
ai.model=gpt-4.1-mini

# Cloudinary Configuration
cloudinary.cloud-name= ${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# Horse Rating Configuration
horse-rating.first-base=6
horse-rating.first-max=12
horse-rating.second-base=2
horse-rating.second-max=5
horse-rating.third-base=1
horse-rating.third-max=4
horse-rating.fourth-fifth-max=2
horse-rating.dnf-change=-4
horse-rating.disqualified-change=-6
horse-rating.max-decrease=-8
horse-rating.large-field-size=8
horse-rating.policy-version=1

horse-rating.strong-opponent-difference=20
horse-rating.medium-opponent-difference=10
horse-rating.weak-opponent-difference=1

horse-rating.first-strong-opponent-bonus=3
horse-rating.first-medium-opponent-bonus=2
horse-rating.first-weak-opponent-bonus=1
horse-rating.top-three-strong-opponent-bonus=2
horse-rating.top-three-medium-opponent-bonus=1
horse-rating.fourth-fifth-opponent-bonus=1

horse-rating.winner-large-gap-percent=2.0
horse-rating.winner-medium-gap-percent=1.0
horse-rating.top-three-close-gap-percent=0.5
horse-rating.fourth-fifth-close-gap-percent=2.0

horse-rating.winner-large-gap-bonus=2
horse-rating.winner-medium-gap-bonus=1
horse-rating.close-finish-bonus=1
horse-rating.large-field-bonus=1

horse-rating.small-underperformance-gap-percent=3.0
horse-rating.medium-underperformance-gap-percent=6.0
horse-rating.severe-underperformance-gap-percent=10.0
horse-rating.small-underperformance-penalty=-2
horse-rating.medium-underperformance-penalty=-4
horse-rating.severe-underperformance-penalty=-6
horse-rating.high-rated-underperformance-difference=20
horse-rating.high-rated-underperformance-extra-penalty=-2

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Notification Configuration
notification.websocket.endpoint=/ws
notification.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok.io}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok.io}
notification.email.enabled=true
notification.email.max-attempts=3
notification.email.retry-delay-minutes=5,30
notification.event.max-attempts=3
notification.event.batch-size=50
notification.delivery.batch-size=50
notification.retention-days=90
notification.worker.fixed-delay-ms=5000

# Appeal evidence upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
appeal.evidence.max-file-size-bytes=52428800
