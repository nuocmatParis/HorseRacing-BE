spring.application.name=SWP391_Project_HRTMS

spring.main.banner-mode=off

logging.level.root=info

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JWT Configuration
jwt.signer-key=${JWT_SIGNER_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL}

openai.api.key=${OPENAI_API_KEY}
#openai.base-url=https://api.yescale.io/v1
ai.model=gpt-4.1-mini

# Cloudinary Configuration
cloudinary.cloud-name= ${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# Horse Rating Configuration
horse-rating.first-min=6
horse-rating.first-max=12
horse-rating.second-min=2
horse-rating.second-max=5
horse-rating.third-min=1
horse-rating.third-max=4
horse-rating.fourth-fifth-min=0
horse-rating.fourth-fifth-max=2
horse-rating.other-min=-8
horse-rating.other-max=0
horse-rating.disqualified-min=-8
horse-rating.disqualified-max=0
horse-rating.policy-version=1

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Notification Configuration
notification.websocket.endpoint=/ws
notification.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok.io}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok.io}
notification.email.enabled=true
notification.email.max-attempts=3
notification.email.retry-delay-minutes=5,30
notification.event.max-attempts=3
notification.event.batch-size=50
notification.delivery.batch-size=50
notification.retention-days=90
notification.worker.fixed-delay-ms=5000

# Appeal evidence upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
appeal.evidence.max-file-size-bytes=52428800
