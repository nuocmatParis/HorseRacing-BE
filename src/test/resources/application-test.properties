spring.application.name=SWP391_Project_HRTMS_Test

logging.level.root=info

spring.datasource.url=jdbc:mysql://localhost:3306/SWP391_Project_HRTMS
spring.datasource.username=horse_app
spring.datasource.password=${TEST_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JWT Configuration
jwt.signer-key=${TEST_JWT_SIGNER_KEY:test-only-jwt-signer-key-at-least-32-bytes-long}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Never send real notification email while running tests.
notification.email.enabled=false

# Horse Rating Configuration
horse-rating.first-min=6
horse-rating.first-max=12
horse-rating.second-min=2
horse-rating.second-max=5
horse-rating.third-min=1
horse-rating.third-max=4
horse-rating.fourth-fifth-min=0
horse-rating.fourth-fifth-max=2
horse-rating.other-min=-8
horse-rating.other-max=0
horse-rating.dnf-min=-8
horse-rating.dnf-max=0
horse-rating.disqualified-min=-8
horse-rating.disqualified-max=0
horse-rating.policy-version=1
